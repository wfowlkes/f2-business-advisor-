name: LIBERIENT Merchant Readiness Tests
on:
  push:
    branches: ["main", "liberient-readonly-validation-gate-20261017"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Read-only gate regressions
        run: |
          node --test tests/test_merchant_readiness.js
          node --test tests/test_experience.js
