name: F2 Commerce Learning Lab tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check forecasting engine
        run: node --check core.js
      - name: Syntax-check synthetic evaluation engine
        run: node --check lab/synthetic.js && node --check lab/report.js
      - name: Run offline Learning Lab core checks
        run: node tests/test_core.js
      - name: Validate frozen baselines, adversarial scenarios, shadow challenger and daily report
        run: node --test tests/test_synthetic_lab.js tests/test_report.js
