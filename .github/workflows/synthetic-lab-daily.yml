name: Synthetic Learning Lab daily review
on:
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check synthetic and existing backend safeguards
        run: node --test server/test/*.test.js tests/test_report.js tests/test_scenario_methods.js && node tests/test_core.js
      - name: Generate reproducible synthetic evidence package
        run: node lab/report.js && F2_SCENARIO_OUTPUT=synthetic-report node lab/scenario_report.js
      - name: Generate dated internal transition replay (synthetic-only)
        run: node lab/transition_report.js
      - name: Store dated synthetic-only report
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-learning-lab-${{ github.run_number }}
          path: |
            synthetic-report/
            transition-evidence/
          retention-days: 30
