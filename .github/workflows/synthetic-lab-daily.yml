name: Synthetic Learning Lab daily review
on:
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check synthetic and existing backend safeguards
        run: node --test server/test/*.test.js && node tests/test_core.js && node --test tests/test_report.js
      - name: Generate reproducible synthetic evidence package
        run: node lab/report.js
      - name: Store dated synthetic-only report
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-learning-lab-${{ github.run_number }}
          path: synthetic-report/
          retention-days: 30
