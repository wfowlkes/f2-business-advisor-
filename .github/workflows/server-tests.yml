name: Shopify bridge read-only tests

on:
  push:
    paths:
      - 'server/**'
      - 'experience/**'
      - 'lab/**'
      - 'tests/**'
      - 'core.js'
      - '.github/workflows/server-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'experience/**'
      - 'lab/**'
      - 'tests/**'
      - 'core.js'
      - '.github/workflows/server-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/app.js
      - run: node --check server/shopify.js
      - run: node --check server/assistant.js
      - run: node --check experience/framework.js
      - run: node --check experience/ui.js
      - run: node --check lab/synthetic.js
      - run: node --test server/test/*.test.js tests/test_report.js tests/test_experience.js
      - run: node tests/test_core.js
      - run: node -e "const fs=require('node:fs'),assert=require('node:assert/strict');assert.equal(fs.readFileSync('core.js','utf8'),fs.readFileSync('experience/core.js','utf8'))"
