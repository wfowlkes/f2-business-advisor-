name: Shopify bridge read-only tests

on:
  push:
    paths:
      - 'server/**'
      - 'core.js'
      - '.github/workflows/server-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'core.js'
      - '.github/workflows/server-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/app.js
      - run: node --check server/shopify.js
      - run: node --test server/test/*.test.js
      - run: node tests/test_core.js
